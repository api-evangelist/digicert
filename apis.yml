description: >-
  Digicert is a leading provider of digital security solutions, specializing in SSL/TLS certificates, PKI solutions, and
  website security. They help organizations of all sizes protect their websites, data, and communications from cyber
  threats by providing secure encryption and authentication services. Digicert's CertCentral platform exposes a suite of
  REST and GraphQL APIs for certificate lifecycle management, discovery, automation, and reporting.
